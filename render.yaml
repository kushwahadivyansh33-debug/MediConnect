services:
  # MediConnect Web Application
  - type: web
    name: mediconnect-app
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MEDICONNECT_DATA_FILE
        value: /var/data/database.json
    disk:
      name: mediconnect-data
      mountPath: /var/data
      sizeGB: 1
