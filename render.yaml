services:
  # MediConnect Web Application
  - type: web
    name: mediconnect-app
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mediconnect-db
          property: connectionString

  # Render Managed PostgreSQL Service (Optional persistent backing)
  - type: postgres
    name: mediconnect-db
    plan: starter
    region: oregon
    databaseName: mediconnect
    user: mediconnect_user
