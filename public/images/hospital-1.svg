<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="glass1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#sky1)" />
  <!-- Clouds -->
  <circle cx="80" cy="50" r="25" fill="#FFFFFF" opacity="0.8" />
  <circle cx="110" cy="45" r="35" fill="#FFFFFF" opacity="0.8" />
  <circle cx="140" cy="50" r="25" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Hospital Building 1 (City Care) -->
  <polygon points="60,90 220,60 220,240 60,250" fill="#E2E8F0" />
  <polygon points="220,60 340,75 340,245 220,240" fill="#CBD5E1" />
  
  <!-- Windows -->
  <g fill="url(#glass1)">
    <polygon points="80,105 130,95 130,125 80,132" />
    <polygon points="150,92 200,82 200,112 150,120" />
    <polygon points="80,145 130,135 130,165 80,172" />
    <polygon points="150,132 200,122 200,152 150,160" />
    <polygon points="80,185 130,175 130,205 80,212" />
    <polygon points="150,172 200,162 200,192 150,200" />

    <polygon points="240,90 280,95 280,122 240,118" />
    <polygon points="295,97 325,100 325,127 295,124" />
    <polygon points="240,130 280,135 280,162 240,158" />
    <polygon points="295,137 325,140 325,167 295,164" />
    <polygon points="240,170 280,175 280,202 240,198" />
    <polygon points="295,177 325,180 325,207 295,204" />
  </g>
  
  <!-- Hospital Cross Emblem on Top -->
  <circle cx="280" cy="50" r="14" fill="#0284C7" />
  <rect x="277" y="42" width="6" height="16" fill="#FFFFFF" rx="1" />
  <rect x="272" y="47" width="16" height="6" fill="#FFFFFF" rx="1" />
  
  <!-- Trees and lawn -->
  <rect y="235" width="400" height="25" fill="#10B981" />
  <circle cx="50" cy="235" r="18" fill="#059669" />
  <circle cx="350" cy="235" r="22" fill="#047857" />
  <circle cx="230" cy="240" r="14" fill="#10B981" />
</svg>
